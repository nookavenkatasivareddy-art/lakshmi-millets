<section class="container products-page">
  <h2 class="section-title">Our <span class="highlight">Products</span></h2>

    <!-- Filter & Sort Controls -->
  <div class="products-toolbar">

    <button type="button" class="toolbar-btn" (click)="toggleFilters()">
      ☰ Filter
    </button>

    <button type="button" class="toolbar-btn" (click)="toggleSort()">
      ⇅ Sort
    </button>

  </div>

  <!-- Filter Panel -->
  <div class="products-filter-panel" *ngIf="showFilters">
    <div class="filter-panel-header">
      <strong>Filter by Category</strong>
      <button type="button" (click)="toggleFilters()">✕</button>
    </div>

    <button
      type="button"
      class="filter-option"
      [class.active]="!activeCategory"
      (click)="filterByCategory(''); toggleFilters()"
    >
      All Products
    </button>

    <button
      type="button"
      class="filter-option"
      *ngFor="let c of categories"
      [class.active]="activeCategory === c.slug"
      (click)="filterByCategory(c.slug); toggleFilters()"
    >
      {{ c.name }}
    </button>
  </div>

  <!-- Sort Panel -->
  <div class="products-sort-panel" *ngIf="showSort">
    <button type="button" (click)="setSort('price-low')">
      Price: Low to High
    </button>

    <button type="button" (click)="setSort('price-high')">
      Price: High to Low
    </button>

    <button type="button" (click)="setSort('name-az')">
      Name: A to Z
    </button>

    <button type="button" (click)="setSort('name-za')">
      Name: Z to A
    </button>
  </div>
  
  <div class="filter-row">
    <button class="filter-pill" [class.active]="!activeCategory" (click)="filterByCategory('')">All</button>
    <button class="filter-pill" *ngFor="let c of categories" [class.active]="activeCategory === c.slug"
            (click)="filterByCategory(c.slug)">
      {{ c.name }}
    </button>
  </div>

  <p *ngIf="loading">Loading products...</p>
  <p *ngIf="!loading && products.length === 0">No products found.</p>

  <div class="product-grid">
    <div class="product-card card" *ngFor="let p of products" [class.out-of-stock]="p.stock <= 0">
      <a [routerLink]="['/product', p.slug]" class="product-img">

  <button
    type="button"
    class="wishlist-btn"
    [class.active]="isInWishlist(p)"
    (click)="toggleWishlist(p, $event)"
    [attr.aria-label]="isInWishlist(p) ? 'Remove from wishlist' : 'Add to wishlist'"
  >
    {{ isInWishlist(p) ? '♥' : '♡' }}
  </button>

  <span class="stock-badge out" *ngIf="p.stock <= 0">
    Out of Stock
  </span>

  <span class="stock-badge low" *ngIf="p.stock > 0 && p.stock <= 5">
    Only {{ p.stock }} left
  </span>

  <img
    [src]="p.image | imageUrl:'products'"
    [alt]="p.name"
    onerror="this.src='assets/images/placeholder.jpg'"
  >

</a>
      <a [routerLink]="['/product', p.slug]"><h4>{{ p.name }}</h4></a>
      <small class="weight">{{ p.weight }}</small>
      <div class="product-price">
        <span class="price">₹{{ p.price }}</span>
        <span class="mrp">₹{{ p.mrp }}</span>
      </div>
      <button class="btn btn-primary full-width" [disabled]="p.stock <= 0" (click)="addToCart(p)">
        {{ p.stock <= 0 ? 'Out of Stock' : '🛒 Add to Cart' }}
      </button>
    </div>
  </div>
</section>
