<div class="top-bar">
  <div class="container top-bar-inner">
    <span class="top-left">🌿 Eat Natural. Live Healthy.</span>
    <div class="top-right">
      <a href="tel:+918897626612">📞 +91 88976 26612</a>
      <a href="mailto:support&#64;lakshmimillets.com">✉️ support&#64;lakshmimillets.com</a>
      <span>🚚 Free Delivery on Orders Above ₹1999</span>
    </div>
  </div>
</div>

<header class="main-header">
  <div class="container header-inner">

    <!-- LOGO (left) -->
    <a routerLink="/" class="brand">
      <img src="assets/images/logo.png" alt="Lakshmi Millets & Foods" class="brand-logo">
    </a>

    <!-- NAV (center) -->
    <nav class="main-nav" [class.open]="mobileMenuOpen">
      <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact:true}" (click)="closeMobileMenu()">Home</a>
      <a routerLink="/about" routerLinkActive="active" (click)="closeMobileMenu()">About Us</a>

      <div class="nav-dropdown" (mouseenter)="showProductsMenu = true" (mouseleave)="showProductsMenu = false">
        <a routerLink="/products" routerLinkActive="active">Products <span class="caret">&#9662;</span></a>
        <div class="dropdown-panel" *ngIf="showProductsMenu && categories.length">
          <a *ngFor="let c of categories" [routerLink]="['/products/category', c.slug]" (click)="closeMobileMenu()">
            {{ c.name }}
          </a>
        </div>
      </div>

      <a routerLink="/benefits" routerLinkActive="active" (click)="closeMobileMenu()">Benefits</a>
      <a routerLink="/contact" routerLinkActive="active" (click)="closeMobileMenu()">Contact Us</a>
    </nav>

    <!-- ACTIONS (right) -->
    <div class="header-actions">
      <!-- Desktop search -->
<div class="search-wrap always-visible-search">
  <div class="search-box">
    <input
      type="text"
      placeholder="Search millets..."
      [(ngModel)]="searchTerm"
      (keyup.enter)="onSearch()"
      aria-label="Search products"
    >

    <button
      type="button"
      (click)="onSearch()"
      title="Search"
      aria-label="Search"
    >
      <svg
        viewBox="0 0 24 24"
        width="18"
        height="18"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <circle cx="11" cy="11" r="7"></circle>
        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
      </svg>
    </button>
  </div>
</div>

<!-- Mobile search icon -->
<button
  type="button"
  class="mobile-search-trigger"
  (click)="toggleSearch()"
  aria-label="Open search"
  title="Search"
>
  <svg
    viewBox="0 0 24 24"
    width="21"
    height="21"
    fill="none"
    stroke="currentColor"
    stroke-width="2"
    stroke-linecap="round"
    stroke-linejoin="round"
  >
    <circle cx="11" cy="11" r="7"></circle>
    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
  </svg>
</button>
        
      <!-- Mobile / tablet full-screen search -->
      <!-- Mobile search panel -->
<div class="mobile-search-overlay" *ngIf="showSearch">

  <div class="mobile-search-top">
    <button
      type="button"
      class="mobile-search-back"
      (click)="toggleSearch()"
      aria-label="Close search"
    >
      <svg
        viewBox="0 0 24 24"
        width="22"
        height="22"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <line x1="19" y1="12" x2="5" y2="12"></line>
        <polyline points="12 19 5 12 12 5"></polyline>
      </svg>
    </button>

    <div class="mobile-search-input">
      <input
        type="text"
        placeholder="Search millets..."
        [(ngModel)]="searchTerm"
        (keyup.enter)="onSearch()"
        autofocus
        aria-label="Search products"
      >

      <button
        type="button"
        (click)="onSearch()"
        aria-label="Search"
      >
        <svg
          viewBox="0 0 24 24"
          width="20"
          height="20"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <circle cx="11" cy="11" r="7"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
      </button>
    </div>
  </div>

  <div class="mobile-explore-section">
    <h3>Explore More</h3>

    <div class="mobile-category-chips">
      <button
        type="button"
        *ngFor="let c of categories"
        (click)="searchTerm = c.name; onSearch()"
      >
        {{ c.name }}
      </button>
    </div>
  </div>

</div>

          <div class="mobile-explore-section">
    <h3>Explore More</h3>

    <div class="mobile-category-chips">
      <button
        type="button"
        *ngFor="let c of categories"
        (click)="searchTerm = c.name; onSearch()"
      >
        {{ c.name }}
      </button>
    </div>
  </div>

</div>

<!-- Category picker sheet (mobile/tablet) -->
<div class="category-picker-backdrop" *ngIf="showCategoryPicker" (click)="showCategoryPicker = false">

      <!-- Category picker sheet (mobile/tablet) -->
      <div class="category-picker-backdrop" *ngIf="showCategoryPicker" (click)="showCategoryPicker = false">
        <div class="category-picker-sheet" (click)="$event.stopPropagation()">
          <div class="cat-option" *ngFor="let opt of categoryOptions" (click)="pickCategory(opt)">
            <span>{{ opt }}</span>
            <span class="radio-dot" [class.checked]="selectedCategoryName === opt"></span>
          </div>
        </div>
      </div>

      <div class="account-box" *ngIf="!currentUser">
        <a routerLink="/login" class="icon-btn" title="Login" aria-label="Login">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
            <circle cx="12" cy="7" r="4"></circle>
          </svg>
        </a>
      </div>
      <div class="account-box dropdown" *ngIf="currentUser">
        <button class="icon-btn" (click)="showAccountMenu = !showAccountMenu" title="Account">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
            <circle cx="12" cy="7" r="4"></circle>
          </svg>
        </button>
        <div class="dropdown-panel account-panel" *ngIf="showAccountMenu">
          <span class="hello">Hi, {{ firstName }}</span>
          <a routerLink="/orders" (click)="showAccountMenu = false">My Orders</a>
          <button class="logout-btn" (click)="logout()">Logout</button>
        </div>
      </div>

            <a
  routerLink="/wishlist"
  class="icon-btn wishlist-link"
  title="Wishlist"
  aria-label="Wishlist"
>
  <span class="wishlist-icon-wrap">
    <svg
      viewBox="0 0 24 24"
      width="20"
      height="20"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
    >
      <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78L12 21.23l8.84-8.84a5.5 5.5 0 0 0 0-7.78z"></path>
    </svg>

    <span
      class="wishlist-count"
      *ngIf="wishlistCount > 0"
    >
      {{ wishlistCount }}
    </span>
  </span>
</a>

      <a routerLink="/cart" class="icon-btn cart-link" title="Cart" aria-label="Cart">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="9" cy="21" r="1"></circle>
          <circle cx="20" cy="21" r="1"></circle>
          <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
        </svg>
        <span class="cart-badge" *ngIf="cartCount > 0">{{ cartCount }}</span>
      </a>

      <button class="mobile-toggle" (click)="mobileMenuOpen = !mobileMenuOpen" aria-label="Menu">
        <span></span><span></span><span></span>
      </button>
    </div>
  </div>
</header>
