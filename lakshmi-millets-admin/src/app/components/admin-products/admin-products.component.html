<div class="admin-page">
  <div class="admin-page-header">
    <h2>Products</h2>
    <button class="btn btn-primary" (click)="openAddForm()">+ Add Product</button>
  </div>

  <div class="toolbar card">
    <input type="text" [(ngModel)]="search" (keyup.enter)="onSearch()" placeholder="Search products..." class="search-input">
  </div>

  <div *ngIf="showAddForm" class="form-card card">
    <h3>{{ isEditing ? 'Edit' : 'Add' }} Product</h3>
    <div class="form-grid">
      <div class="form-group"><label>Name *</label><input [(ngModel)]="productForm.name" placeholder="Product name"></div>
      <div class="form-group"><label>Price *</label><input type="number" [(ngModel)]="productForm.price" placeholder="Price"></div>
      <div class="form-group"><label>MRP *</label><input type="number" [(ngModel)]="productForm.mrp" placeholder="MRP"></div>
      <div class="form-group"><label>Category *</label>
        <select [(ngModel)]="productForm.categoryId">
          <option value="">Select category</option>
          <option *ngFor="let c of categories" [value]="c.id">{{ c.name }}</option>
        </select>
      </div>

      <div class="form-group"><label>Brand</label>
        <select [(ngModel)]="productForm.brandId">
          <option value="">Select brand</option>
          <option *ngFor="let b of brands" [value]="b.id">{{ b.name }}</option>
        </select>
      </div>

      <div class="form-group"><label>Product Type</label>
        <select [(ngModel)]="productForm.productTypeId">
          <option value="">Select product type</option>
          <option *ngFor="let pt of productTypes" [value]="pt.id">{{ pt.name }}</option>
        </select>
      </div>

      <div class="form-group"><label>Weight</label><input [(ngModel)]="productForm.weight" placeholder="e.g. 1kg"></div>
      <div class="form-group"><label>Stock</label><input type="number" [(ngModel)]="productForm.stock" placeholder="0"></div>
      <div class="form-group"><label>Description</label><textarea [(ngModel)]="productForm.description" rows="3" placeholder="Description"></textarea></div>
      <div class="form-group"><label>Image URL</label><input [(ngModel)]="productForm.image" placeholder="/uploads/products/image.jpg"></div>
      <div class="form-group">
        <label>&nbsp;</label>
        <label class="checkbox-label">
          <input type="checkbox" [(ngModel)]="productForm.isPopular"> Popular
        </label>
      </div>

      <div class="form-group">
        <label>&nbsp;</label>
        <label class="checkbox-label">
          <input type="checkbox" [(ngModel)]="productForm.isFeatured"> Featured
        </label>
      </div>
    </div>
    <div class="form-actions">
      <button class="btn btn-primary" (click)="saveProduct()">{{ isEditing ? 'Update' : 'Save' }}</button>
      <button class="btn btn-outline" (click)="closeAddForm()">Cancel</button>
    </div>
  </div>

  <p *ngIf="loading">Loading products...</p>
  <p *ngIf="!loading && errorMsg" class="error-text">{{ errorMsg }}</p>

  <div *ngIf="!loading && products.length" class="table-wrapper">
    <table class="admin-table">
      <thead><tr><th>Image</th><th>Name</th><th>Category</th><th>Price</th><th>MRP</th><th>Stock</th><th>Actions</th></tr></thead>
      <tbody>
        <tr *ngFor="let p of products">
          <td><img [src]="getProductImage(p)" alt="" class="table-img"></td>
          <td>{{ p.name }}</td>
          <td>{{ p.category?.name || '-' }}</td>
          <td>₹{{ p.price }}</td>
          <td class="mrp">₹{{ p.mrp }}</td>
          <td [class.low-stock]="p.stock < 10">{{ p.stock }}</td>
          <td>
            <button class="btn btn-outline tiny" (click)="editProduct(p)">Edit</button>
            <button class="btn btn-outline tiny danger" (click)="deleteProduct(p)">Delete</button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <div *ngIf="!loading && !products.length && !errorMsg" class="empty-state card">No products found.</div>

  <div *ngIf="totalPages > 1" class="pagination">
    <button class="btn btn-outline tiny" [disabled]="page <= 1" (click)="goToPage(page - 1)">← Prev</button>
    <span>Page {{ page }} of {{ totalPages }}</span>
    <button class="btn btn-outline tiny" [disabled]="page >= totalPages" (click)="goToPage(page + 1)">Next →</button>
  </div>
</div>
